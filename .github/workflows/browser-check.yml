name: Browser check

on:
  workflow_call:
    inputs:
      browser:
        type: string
        required: true
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    container:
      # Browser binaries are preinstalled and match the npm package.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 8
    env:
      HOME: /root
      BROWSER_ENGINE: ${{ inputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: log.view
      - uses: actions/checkout@v4
        with:
          repository: byuwur/spa.js
          ref: v20.16
          path: spa.js
      - uses: actions/checkout@v4
        with:
          repository: byuwur/code.view
          ref: v2.2
          path: code.view
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked test tools
        working-directory: log.view
        run: npm --prefix .github ci --ignore-scripts --no-audit --no-fund
      - name: Run core browser checks
        working-directory: log.view
        env:
          NODE_PATH: ${{ github.workspace }}/log.view/.github/node_modules
        run: node --test --test-concurrency=1 __tests__/rendering.cjs __tests__/playground.cjs

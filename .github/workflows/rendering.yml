name: Rendering checks

on:
  workflow_call:
  # The release workflow already calls these checks on main, version tags and pull requests.
  push:
    branches-ignore: [main]
    tags-ignore: ["v*"]
  workflow_dispatch:
    inputs:
      browser:
        description: Browsers to test
        type: choice
        options: [all, chromium, firefox, webkit]
        default: all

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: browser (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: >-
          ${{ fromJSON(
            (inputs.browser || 'all') == 'all' && '["chromium","firefox","webkit"]'
            || format('["{0}"]', inputs.browser)
          ) }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: ${{ matrix.browser }}

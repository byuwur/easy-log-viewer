name: Rendering checks

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendering_chromium:
    name: rendering (chromium)
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: chromium
      suite: rendering

  rendering_firefox:
    name: rendering (firefox)
    needs: rendering_chromium
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: firefox
      suite: rendering

  rendering_webkit:
    name: rendering (webkit)
    needs: rendering_firefox
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: webkit
      suite: rendering

  playground_chromium:
    name: playground (chromium)
    needs: rendering_webkit
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: chromium
      suite: playground

  playground_firefox:
    name: playground (firefox)
    needs: playground_chromium
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: firefox
      suite: playground

  playground_webkit:
    name: playground (webkit)
    needs: playground_firefox
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: webkit
      suite: playground

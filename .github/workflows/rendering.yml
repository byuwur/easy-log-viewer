name: Rendering checks

on:
  workflow_call:
  # The release workflow already calls these checks on main, version tags and pull requests.
  push:
    branches-ignore: [main]
    tags-ignore: ["v*"]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser for this run
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: ${{ inputs.browser || 'chromium' }}
